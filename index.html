<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Video & Chat Call</title>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 95vh; box-sizing: border-box; }
        .container { display: flex; flex: 1; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
        .video-box { position: relative; width: 45%; min-width: 300px; background: #222; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; aspect-ratio: 4/3; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 4px; font-size: 14px; }
        .controls, .setup { margin: 10px 0; text-align: center; }
        input, button { padding: 8px 12px; margin: 4px; border-radius: 4px; border: none; font-size: 14px; }
        button { background: #007bff; color: white; cursor: pointer; }
        button:hover { background: #0056b3; }
        .chat-container { width: 100%; max-width: 800px; margin: 0 auto; background: #1e1e1e; border-radius: 8px; display: flex; flex-direction: column; height: 150px; }
        .chat-messages { flex: 1; padding: 10px; overflow-y: auto; font-size: 14px; border-bottom: 1px solid #333; }
        .chat-input-area { display: flex; padding: 5px; }
        .chat-input-area input { flex: 1; background: #2a2a2a; color: white; }
    </style>
</head>
<body>

    <h2 style="text-align: center; margin: 5px;">P2P Video & Chat Call</h2>
    
    <div class="setup">
        <span id="my-code-display">Generating code...</span>
        <br><br>
        <input type="text" id="remote-code-input" placeholder="Enter other device code">
        <button onclick="connectToPeer()">Connect</button>
    </div>

    <div class="container">
        <div class="video-box">
            <video id="local-video" autoplay muted playsinline></video>
            <div class="label">My Camera (Off)</div>
        </div>
        <div class="video-box">
            <video id="remote-video" autoplay playsinline></video>
            <div class="label">Remote Camera</div>
        </div>
    </div>

    <div class="controls">
        <button id="cam-btn" onclick="toggleCamera()">Turn On Camera</button>
        <button id="mic-btn" onclick="toggleMic()" disabled>Mute Mic</button>
    </div>

    <div class="chat-container">
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

<script>
    let localStream = null;
    let peer = null;
    let conn = null;
    let currentCall = null;
    let isCameraOn = false;
    let isMicMuted = false;

    // Page refresh korlei random unique code generate hobe
    function generateRandomCode() {
        return Math.random().toString(36).substring(2, 8);
    }

    const myId = generateRandomCode();
    document.getElementById('my-code-display').innerText = "Your Code: " + myId;

    // PeerJS initialization
    peer = new Peer(myId);

    peer.on('open', (id) => {
        console.log('My peer ID is: ' + id);
    });

    // Handle incoming calls
    peer.on('call', (call) => {
        currentCall = call;
        if (localStream) {
            call.answer(localStream);
        } else {
            // Jodi local camera on na thake, tahole empty stream ba audio diye answer korbe
            navigator.mediaDevices.getUserMedia({ video: false, audio: true }).then(stream => {
                call.answer(stream);
            }).catch(() => call.answer());
        }
        
        call.on('stream', (remoteStream) => {
            document.getElementById('remote-video').srcObject = remoteStream;
        });
    });

    // Handle incoming data connections (Chat)
    peer.on('connection', (connection) => {
        conn = connection;
        setupConnectionEvents();
    });

    function connectToPeer() {
        const remoteId = document.getElementById('remote-code-input').value.trim();
        if (!remoteId) return alert('Please enter a code!');

        conn = peer.connect(remoteId);
        setupConnectionEvents();

        if (localStream) {
            currentCall = peer.call(remoteId, localStream);
            currentCall.on('stream', (remoteStream) => {
                document.getElementById('remote-video').srcObject = remoteStream;
            });
        } else {
            navigator.mediaDevices.getUserMedia({ video: false, audio: true }).then(stream => {
                currentCall = peer.call(remoteId, stream);
                currentCall.on('stream', (remoteStream) => {
                    document.getElementById('remote-video').srcObject = remoteStream;
                });
            });
        }
        alert('Connecting...');
    }

    function setupConnectionEvents() {
        conn.on('data', (data) => {
            appendMessage('Remote: ' + data);
        });
    }

    // Camera On/Off Toggle Function
    async function toggleCamera() {
        const camBtn = document.getElementById('cam-btn');
        const micBtn = document.getElementById('mic-btn');

        if (!isCameraOn) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;
                isCameraOn = true;
                camBtn.innerText = "Turn Off Camera";
                micBtn.disabled = false;

                // Jodi age thekei call connected thake, tahole track update kore dite hobe
                if (currentCall) {
                    const videoTrack = localStream.getVideoTracks()[0];
                    const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === videoTrack.kind);
                    if (sender) sender.replaceTrack(videoTrack);
                }
            } catch (err) {
                alert('Camera permission denied or error!');
            }
        } else {
            localStream.getTracks().forEach(track => track.stop());
            document.getElementById('local-video').srcObject = null;
            isCameraOn = false;
            camBtn.innerText = "Turn On Camera";
            micBtn.disabled = true;
            micBtn.innerText = "Mute Mic";
            isMicMuted = false;
        }
    }

    // Mic Mute/Unmute Function
    function toggleMic() {
        if (!localStream) return;
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
            isMicMuted = !isMicMuted;
            audioTrack.enabled = !isMicMuted;
            document.getElementById('mic-btn').innerText = isMicMuted ? "Unmute Mic" : "Mute Mic";
        }
    }

    // Chat Functions
    function sendMessage() {
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if (!message) return;

        if (conn && conn.open) {
            conn.send(message);
            appendMessage('You: ' + message);
            input.value = '';
        } else {
            alert('Not connected to any device yet!');
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    function appendMessage(text) {
        const chatBox = document.getElementById('chat-messages');
        chatBox.innerHTML += `<div>${text}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
