<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium P2P Call</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #6366f1; }
        body { margin: 0; padding: 10px; font-family: sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Responsive Layout */
        .main-container { display: flex; flex-direction: row; gap: 10px; height: calc(100vh - 120px); }
        @media (max-width: 768px) { .main-container { flex-direction: column; } }

        .video-wrapper { flex: 2; display: flex; flex-direction: column; gap: 10px; }
        .video-box { background: #000; border-radius: 12px; flex: 1; overflow: hidden; position: relative; border: 2px solid #334155; }
        video { width: 100%; height: 100%; object-fit: cover; }

        .controls { padding: 10px; display: flex; justify-content: center; gap: 10px; }
        button { padding: 12px 20px; border: none; border-radius: 8px; background: var(--accent); color: white; font-weight: bold; cursor: pointer; }
        
        .chat-wrapper { flex: 1; background: var(--card); border-radius: 12px; display: flex; flex-direction: column; }
        .chat-box { flex: 1; overflow-y: auto; padding: 10px; font-size: 14px; }
        .input-area { padding: 10px; display: flex; gap: 5px; }
        input { flex: 1; padding: 10px; border-radius: 8px; border: none; background: #334155; color: white; }
    </style>
</head>
<body>

<div style="text-align: center; margin-bottom: 10px;">
    Code: <b id="my-id">...</b> | <input id="remote-id" placeholder="Partner Code"> <button onclick="connect()">Connect</button>
</div>

<div class="main-container">
    <div class="video-wrapper">
        <div class="video-box"><video id="local-video" autoplay muted playsinline></video></div>
        <div class="video-box"><video id="remote-video" autoplay playsinline></video></div>
        <div class="controls">
            <button onclick="toggleCam()">Cam</button>
            <button onclick="toggleMic()">Mic</button>
        </div>
    </div>
    <div class="chat-wrapper">
        <div id="chat-box" class="chat-box"></div>
        <div class="input-area">
            <input id="msg-input" placeholder="Message...">
            <button onclick="sendMsg()">Send</button>
        </div>
    </div>
</div>

<script>
    let peer = new Peer();
    let conn, currentCall, localStream;

    peer.on('open', id => document.getElementById('my-id').innerText = id);

    // Disconnect listener: Refresh page if connection lost
    function setupDisconnectListener() {
        window.addEventListener('beforeunload', () => conn?.send('__DISCONNECT__'));
    }

    peer.on('connection', c => {
        conn = c;
        conn.on('data', data => {
            if (data === '__DISCONNECT__') window.location.reload();
            else appendMsg(data);
        });
        conn.on('close', () => window.location.reload());
    });

    peer.on('call', call => {
        navigator.mediaDevices.getUserMedia({video: true, audio: true}).then(s => {
            localStream = s;
            document.getElementById('local-video').srcObject = s;
            call.answer(s);
            currentCall = call;
            call.on('stream', st => document.getElementById('remote-video').srcObject = st);
            call.on('close', () => window.location.reload());
        });
    });

    function connect() {
        let id = document.getElementById('remote-id').value;
        conn = peer.connect(id);
        navigator.mediaDevices.getUserMedia({video: true, audio: true}).then(s => {
            localStream = s;
            document.getElementById('local-video').srcObject = s;
            currentCall = peer.call(id, s);
            currentCall.on('stream', st => document.getElementById('remote-video').srcObject = st);
            currentCall.on('close', () => window.location.reload());
        });
    }

    function toggleCam() {
        let v = localStream.getVideoTracks()[0];
        v.enabled = !v.enabled;
    }

    function toggleMic() {
        let a = localStream.getAudioTracks()[0];
        a.enabled = !a.enabled;
    }

    function sendMsg() {
        let m = document.getElementById('msg-input').value;
        conn.send(m);
        appendMsg("You: " + m);
    }

    function appendMsg(m) {
        document.getElementById('chat-box').innerHTML += `<div>${m}</div>`;
    }
</script>
</body>
</html>
