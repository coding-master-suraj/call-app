<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Video & Audio Call App</title>
    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
            text-align: center;
        }

        h2, h3 {
            color: var(--text-color);
            margin-top: 0;
        }

        input, button {
            padding: 12px 15px;
            font-size: 16px;
            margin: 8px 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
        }

        input {
            width: 60%;
            max-width: 300px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        #login-screen { display: block; }
        #app-screen { display: none; }

        .video-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin-top: 20px;
            gap: 15px;
        }

        .video-box {
            flex: 1;
            min-width: 300px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        video {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: #111;
            transform: scaleX(-1);
        }

        .video-box p {
            position: absolute;
            bottom: 5px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 14px;
            margin: 0;
        }

        #my-id {
            font-weight: bold;
            color: #28a745;
            background: #e6f4ea;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
        }

        .error-msg {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- ১. পাসওয়ার্ড প্রোটেকশন স্ক্রিন -->
        <div id="login-screen">
            <h2>🔒 সিকিউরিটি ভেরিফিকেশন</h2>
            <p>গুগল স্ক্রিপ্ট দ্বারা সুরক্ষিত ভিডিও কল অ্যাপ</p>
            <input type="password" id="pass-input" placeholder="পাসওয়ার্ড লিখুন">
            <br>
            <button id="verify-btn" onclick="verifyPassword()">ভেরিফাই করুন</button>
            <div id="error-box" class="error-msg"></div>
        </div>

        <!-- ২. মেইন ভিডিও কল অ্যাপ স্ক্রিন -->
        <div id="app-screen">
            <h2>🎥 সুরক্ষিত ভিডিও ও অডিও কল</h2>
            
            <div>
                <p>আপনার ইউনিক আইডি: <span id="my-id">কানেক্ট হচ্ছে...</span></p>
            </div>

            <div class="controls">
                <input type="text" id="call-id-input" placeholder="অপর ব্যক্তির আইডি দিন">
                <button id="call-btn">কল করুন</button>
            </div>

            <div class="video-container">
                <div class="video-box">
                    <p>আমার ক্যামেরা</p>
                    <video id="local-video" autoplay muted playsinline></video>
                </div>
                <div class="video-box">
                    <p>অপর প্রান্তের ক্যামেরা</p>
                    <video id="remote-video" autoplay playsinline></video>
                </div>
            </div>
        </div>
    </div>

    <!-- PeerJS লাইব্রেরি CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <script>
        // এখানে আপনার নতুন গুগল স্ক্রিপ্ট ওয়েব অ্যাপ ইউআরএল বসাবেন
        const SCRIPT_URL = "YOUR_NEW_WEB_APP_URL_HERE";

        function verifyPassword() {
            const passInput = document.getElementById("pass-input");
            const verifyBtn = document.getElementById("verify-btn");
            const errorBox = document.getElementById("error-box");
            const enteredPass = passInput.value.trim();

            if (!enteredPass) {
                errorBox.innerText = "দয়া করে পাসওয়ার্ড লিখুন!";
                return;
            }

            passInput.disabled = true;
            verifyBtn.disabled = true;
            verifyBtn.innerText = "যাচাই করা হচ্ছে...";
            errorBox.innerText = "";

            // ফেচ রিকোয়েস্ট পাঠানো
            fetch(SCRIPT_URL + "?pass=" + encodeURIComponent(enteredPass))
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        document.getElementById("login-screen").style.display = "none";
                        document.getElementById("app-screen").style.display = "block";
                        document.getElementById("my-id").innerText = data.uniqueId;
                        initVideoCall();
                    } else {
                        passInput.disabled = false;
                        verifyBtn.disabled = false;
                        verifyBtn.innerText = "ভেরিফাই করুন";
                        errorBox.innerText = data.message;
                    }
                })
                .catch(error => {
                    passInput.disabled = false;
                    verifyBtn.disabled = false;
                    verifyBtn.innerText = "ভেরিফাই করুন";
                    errorBox.innerText = "কানেকশন এরর! আবার চেষ্টা করুন।";
                    console.error("Error:", error);
                });
        }

        function initVideoCall() {
            const peer = new Peer();
            let localStream;

            const localVideo = document.getElementById('local-video');
            const remoteVideo = document.getElementById('remote-video');
            const callIdInput = document.getElementById('call-id-input');
            const callBtn = document.getElementById('call-btn');

            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                .then(stream => {
                    localStream = stream;
                    localVideo.srcObject = stream;
                })
                .catch(error => {
                    console.error("ক্যামেরা ত্রুটি: ", error);
                    alert("দয়া করে ক্যামেরা ও মাইক্রোফোনের পারমিশন দিন!");
                });

            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', remoteStream => {
                    remoteVideo.srcObject = remoteStream;
                });
            });

            callBtn.addEventListener('click', () => {
                const remoteId = callIdInput.value.trim();
                if (!remoteId) {
                    alert("দয়া করে আইডি দিন!");
                    return;
                }

                const call = peer.call(remoteId, localStream);
                call.on('stream', remoteStream => {
                    remoteVideo.srcObject = remoteStream;
                });
            });
        }
    </script>
</body>
</html>
