<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Premium P2P Video Call & Chat</title>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-color);
            background-image: radial-gradient(circle at top right, #1e1b4b, transparent), radial-gradient(circle at bottom left, #0f172a, transparent);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin: 5px 0 10px 0;
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .setup-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 12px 15px;
            border-radius: 12px;
            max-width: 800px;
            margin: 0 auto 10px auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .code-box {
            font-size: clamp(0.9rem, 2vw, 1rem);
        }

        .code-box span {
            color: var(--accent);
            font-weight: bold;
            font-family: monospace;
            font-size: clamp(1.1rem, 2.2vw, 1.3rem);
            letter-spacing: 2px;
            background: rgba(99, 102, 241, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .connect-box {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
            max-width: 400px;
            justify-content: flex-end;
        }

        input {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 16px;
            letter-spacing: 2px;
            text-align: center;
            flex: 1;
            min-width: 150px;
        }

        input:focus {
            border-color: var(--accent);
        }

        input:disabled {
            background: #1e293b;
            cursor: not-allowed;
            opacity: 0.7;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
        }

        .main-layout {
            display: flex;
            flex: 1;
            gap: 15px;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .video-section {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 12px;
            width: 100%;
        }

        .video-box {
            position: relative;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
            border: 1px solid var(--border);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .controls button {
            background: #334155;
            flex: 1;
            max-width: 180px;
        }
        .controls button.active {
            background: var(--danger);
        }
        .controls button.active:hover {
            background: var(--danger-hover);
        }

        /* Chat Section */
        .chat-section {
            flex: 1;
            min-width: 280px;
            max-width: 380px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            height: auto;
            max-height: 75vh;
        }

        .chat-header {
            padding: 10px 15px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
        }

        .message {
            padding: 6px 10px;
            border-radius: 8px;
            max-width: 80%;
            word-break: break-word;
        }

        .message.incoming {
            background: #334155;
            align-self: flex-start;
        }

        .message.outgoing {
            background: var(--accent);
            align-self: flex-end;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid var(--border);
            gap: 6px;
        }

        .chat-input-area input {
            flex: 1;
            letter-spacing: normal;
            text-align: left;
        }

        /* Responsive Breakpoints for Tablet & Mobile */
        @media (max-width: 900px) {
            .main-layout {
                flex-direction: column;
            }
            .chat-section {
                max-width: 100%;
                height: 300px;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 5px;
            }
            .setup-card {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                padding: 10px;
            }
            .connect-box {
                max-width: 100%;
                justify-content: center;
            }
            .video-grid {
                grid-template-columns: 1fr;
            }
            .video-box {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <h2>Secure P2P Video & Chat Portal</h2>
    
    <!-- Setup & Connection Card -->
    <div class="setup-card">
        <div class="code-box">
            Your Code: <span id="my-code-display">----</span>
        </div>
        <div class="connect-box">
            <input type="text" id="remote-code-input" maxlength="4" placeholder="4-digit code">
            <button id="connect-btn" onclick="connectToPeer()">Connect</button>
        </div>
    </div>

    <div class="main-layout">
        <!-- Video & Controls Section -->
        <div class="video-section">
            <div class="video-grid">
                <div class="video-box">
                    <video id="local-video" autoplay muted playsinline></video>
                    <div class="label">My Camera (Off)</div>
                </div>
                <div class="video-box">
                    <video id="remote-video" autoplay playsinline></video>
                    <div class="label">Partner Camera</div>
                </div>
            </div>

            <div class="controls">
                <button id="cam-btn" onclick="toggleCamera()">Turn On Camera</button>
                <button id="mic-btn" onclick="toggleMic()" disabled>Mute Mic</button>
            </div>
        </div>

        <!-- Chat Section -->
        <div class="chat-section">
            <div class="chat-header">Live Chat</div>
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

<script>
    let localStream = null;
    let peer = null;
    let conn = null;
    let currentCall = null;
    let isCameraOn = false;
    let isMicMuted = false;
    let isConnected = false;

    // Generate 4-Digit Unique Code on Refresh
    function generate4DigitCode() {
        return Math.floor(1000 + Math.random() * 9000).toString();
    }

    const myId = generate4DigitCode();
    document.getElementById('my-code-display').innerText = myId;

    // Initialize PeerJS with 4-digit ID
    peer = new Peer(myId);

    peer.on('open', (id) => {
        console.log('Connected to server with ID:', id);
    });

    // Handle incoming call from other user
    peer.on('call', (call) => {
        currentCall = call;
        answerCall(call);
    });

    // Handle incoming data connection (Chat & Disconnect sync)
    peer.on('connection', (connection) => {
        conn = connection;
        setupConnectionEvents();
        lockUIOnConnect();
        isConnected = true;
    });

    function connectToPeer() {
        const remoteId = document.getElementById('remote-code-input').value.trim();
        if (remoteId.length !== 4) return alert('Please enter a valid 4-digit code!');
        if (remoteId === myId) return alert('You cannot connect to yourself!');

        lockUIOnConnect();

        // Setup chat connection
        conn = peer.connect(remoteId);
        setupConnectionEvents();

        // Setup video/audio call
        getAudioOrVideo().then(stream => {
            currentCall = peer.call(remoteId, stream);
            currentCall.on('stream', (remoteStream) => {
                document.getElementById('remote-video').srcObject = remoteStream;
                isConnected = true;
            });
            
            currentCall.on('close', () => {
                triggerDisconnect(false);
            });
        });
    }

    function answerCall(call) {
        getAudioOrVideo().then(stream => {
            call.answer(stream);
            call.on('stream', (remoteStream) => {
                document.getElementById('remote-video').srcObject = remoteStream;
                isConnected = true;
            });

            call.on('close', () => {
                triggerDisconnect(false);
            });
        });
    }

    function lockUIOnConnect() {
        const connectBtn = document.getElementById('connect-btn');
        const remoteInput = document.getElementById('remote-code-input');
        
        connectBtn.innerText = "Disconnect";
        connectBtn.style.background = "var(--danger)";
        connectBtn.onclick = () => triggerDisconnect(true);
        remoteInput.disabled = true;
    }

    function getAudioOrVideo() {
        if (localStream) return Promise.resolve(localStream);
        return navigator.mediaDevices.getUserMedia({ video: false, audio: true }).catch(() => {
            return new MediaStream(); // Fallback empty stream
        });
    }

    function setupConnectionEvents() {
        conn.on('data', (data) => {
            if (data === '__DISCONNECT__') {
                triggerDisconnect(false); 
            } else {
                appendMessage(data, 'incoming');
            }
        });

        conn.on('close', () => {
            triggerDisconnect(false);
        });
    }

    // Camera Toggle
    async function toggleCamera() {
        const camBtn = document.getElementById('cam-btn');
        const micBtn = document.getElementById('mic-btn');

        if (!isCameraOn) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;
                isCameraOn = true;
                camBtn.innerText = "Turn Off Camera";
                camBtn.classList.add('active');
                micBtn.disabled = false;

                if (currentCall) {
                    const videoTrack = localStream.getVideoTracks()[0];
                    const sender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === videoTrack.kind);
                    if (sender) sender.replaceTrack(videoTrack);
                }
            } catch (err) {
                alert('Camera access denied or unavailable.');
            }
        } else {
            localStream.getTracks().forEach(track => track.stop());
            document.getElementById('local-video').srcObject = null;
            isCameraOn = false;
            camBtn.innerText = "Turn On Camera";
            camBtn.classList.remove('active');
            micBtn.disabled = true;
            micBtn.classList.remove('active');
            micBtn.innerText = "Mute Mic";
            isMicMuted = false;
        }
    }

    // Mic Toggle
    function toggleMic() {
        if (!localStream) return;
        const audioTrack = localStream.getAudioTracks()[0];
        const micBtn = document.getElementById('mic-btn');
        if (audioTrack) {
            isMicMuted = !isMicMuted;
            audioTrack.enabled = !isMicMuted;
            micBtn.innerText = isMicMuted ? "Unmute Mic" : "Mute Mic";
            micBtn.classList.toggle('active', isMicMuted);
        }
    }

    // Chat Functions
    function sendMessage() {
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if (!message) return;

        if (conn && conn.open) {
            conn.send(message);
            appendMessage(message, 'outgoing');
            input.value = '';
        } else {
            alert('Not connected to any user yet!');
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function appendMessage(text, type) {
        const chatBox = document.getElementById('chat-messages');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Mutual Disconnect & Auto-Refresh Handler
    function triggerDisconnect(sendSignal = true) {
        if (sendSignal && conn && conn.open) {
            conn.send('__DISCONNECT__');
        }
        setTimeout(() => {
            window.location.reload();
        }, 300);
    }
</script>

</body>
</html>
